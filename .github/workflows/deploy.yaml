name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v4
  pull_request:
    branches:
      - v4
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build-public:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        env: 
          BUILD_ENV: "prod"
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
 
  deploy-public:
    needs: build-public
    if: github.ref == 'refs/heads/v4'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-private:
    if: github.ref == 'refs/heads/v4'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Internal Quartz Site
        env:
          BUILD_ENV: "dev"
        run: npx quartz build

      - name: Zip Artifact
        run: |
          cd public
          zip -r ../dev-site.zip .

      - name: Deploy to AWS Amplify
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'ap-south-1' 
          APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
        run: |
          # Request upload URL
          RES=$(aws amplify create-deployment --app-id $APP_ID --branch-name staging)
          UPLOAD_URL=$(echo $RES | jq -r '.zipUploadUrl')
          JOB_ID=$(echo $RES | jq -r '.jobId')
          
          # Upload and Deploy
          curl -H "Content-Type: application/zip" -T dev-site.zip "$UPLOAD_URL"
          aws amplify start-deployment --app-id $APP_ID --branch-name staging --job-id $JOB_ID
